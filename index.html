<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f6fb">
  <meta name="description" content="A polished glassmorphism scientific calculator with keyboard support and calculation history.">
  <title>Luna — Scientific Calculator</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      --text: #24243a;
      --muted: #74758d;
      --subtle: #9999ad;
      --glass: rgba(255, 255, 255, .72);
      --glass-strong: rgba(255, 255, 255, .9);
      --stroke: rgba(116, 113, 158, .15);
      --stroke-bright: rgba(116, 113, 158, .28);
      --violet: #7862d5;
      --pink: #c05a94;
      --mint: #38a98c;
      --danger: #c44965;
      --shadow: 0 28px 80px rgba(61, 58, 103, .12);
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      padding: 38px 22px;
      color: var(--text);
      background:
        radial-gradient(ellipse at 12% 9%, rgba(173, 155, 238, .21), transparent 34%),
        radial-gradient(ellipse at 88% 86%, rgba(127, 211, 190, .19), transparent 34%),
        radial-gradient(ellipse at 80% 6%, rgba(240, 182, 216, .15), transparent 28%),
        #f5f6fb;
    }

    body::before,
    body::after {
      position: fixed;
      z-index: -1;
      width: 310px;
      height: 310px;
      border: 1px solid rgba(137, 121, 190, .12);
      border-radius: 50%;
      content: "";
      filter: blur(.2px);
      pointer-events: none;
    }
    body::before { top: -165px; right: 12%; box-shadow: 0 0 90px rgba(151, 118, 255, .12); }
    body::after { bottom: -210px; left: 8%; width: 410px; height: 410px; border-color: rgba(84, 175, 151, .12); }

    button { font: inherit; }
    button:focus-visible { outline: 2px solid var(--mint); outline-offset: 3px; }

    .shell { width: min(100%, 1080px); }
    .masthead {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin: 0 3px 22px;
    }
    .brand { display: flex; align-items: center; gap: 13px; }
    .brand-mark {
      display: grid;
      width: 46px;
      height: 46px;
      place-items: center;
      border: 1px solid rgba(210, 195, 255, .25);
      border-radius: 16px;
      color: #6951bd;
      background: linear-gradient(145deg, rgba(174, 143, 255, .2), rgba(112, 221, 202, .16));
      box-shadow: inset 0 1px rgba(255,255,255,.8), 0 10px 30px rgba(116, 88, 194, .13);
      font-size: 23px;
    }
    .brand-name { margin: 0; font-size: 17px; font-weight: 750; letter-spacing: -.04em; }
    .brand-caption { margin: 3px 0 0; color: var(--muted); font-size: 11px; }
    .masthead-note {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #77768e;
      font-size: 12px;
    }
    .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--mint); box-shadow: 0 0 12px rgba(167, 243, 220, .8); }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1.55fr) minmax(260px, .75fr);
      gap: 18px;
      align-items: stretch;
    }
    .glass {
      border: 1px solid var(--stroke);
      background: linear-gradient(145deg, rgba(255,255,255,.8), rgba(255,255,255,.48) 36%), var(--glass);
      box-shadow: var(--shadow), inset 0 1px rgba(255,255,255,.92);
      backdrop-filter: blur(30px) saturate(155%);
      -webkit-backdrop-filter: blur(30px) saturate(155%);
    }
    .calculator {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      border-radius: 28px;
      padding: 23px;
      animation: rise-in .7s cubic-bezier(.2,.8,.2,1) both;
    }
    .calculator::before {
      position: absolute;
      z-index: -1;
      top: -130px;
      left: -100px;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      background: rgba(145, 111, 255, .1);
      content: "";
      filter: blur(55px);
    }
    .calculator-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
    }
    .section-label { margin: 0; color: #696982; font-size: 12px; font-weight: 650; }
    .mode-toggle {
      min-height: 34px;
      border: 1px solid var(--stroke);
      border-radius: 11px;
      padding: 0 13px;
      color: #6552b3;
      background: rgba(151, 127, 225, .1);
      font-size: 11px;
      font-weight: 750;
      cursor: pointer;
      transition: background .18s ease, border-color .18s ease;
    }
    .mode-toggle:hover { border-color: rgba(124, 99, 208, .4); background: rgba(160, 131, 244, .16); }

    .display {
      min-height: 144px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      overflow: hidden;
      margin-bottom: 17px;
      border: 1px solid rgba(125, 120, 157, .12);
      border-radius: 20px;
      padding: 17px 19px 14px;
      background: linear-gradient(135deg, rgba(248, 247, 253, .95), rgba(239, 238, 249, .85));
      box-shadow: inset 0 2px 16px rgba(75, 69, 123, .055);
      text-align: right;
    }
    .expression {
      min-height: 30px;
      overflow: hidden;
      color: #85849c;
      direction: ltr;
      font-size: clamp(16px, 2.5vw, 21px);
      font-variant-numeric: tabular-nums;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .result-line {
      min-height: 49px;
      overflow: hidden;
      color: #29263d;
      direction: ltr;
      font-size: clamp(32px, 6vw, 46px);
      font-variant-numeric: tabular-nums;
      font-weight: 580;
      letter-spacing: -.055em;
      line-height: 1.25;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .result-line.error { color: var(--danger); font-size: 17px; letter-spacing: 0; }
    .display-hint { min-height: 16px; margin-top: 3px; color: var(--subtle); font-size: 10px; }
    .key-groups { display: grid; gap: 12px; }
    .scientific-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 9px; }
    .keypad-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 9px; }
    .key {
      position: relative;
      min-width: 0;
      min-height: 56px;
      overflow: hidden;
      border: 1px solid rgba(120, 115, 154, .12);
      border-radius: 16px;
      padding: 0 8px;
      color: #343249;
      background: linear-gradient(155deg, rgba(255,255,255,.94), rgba(255,255,255,.72)), rgba(255,255,255,.82);
      box-shadow: inset 0 1px rgba(255,255,255,.94), 0 5px 15px rgba(59, 54, 100, .07);
      font-size: 18px;
      font-weight: 570;
      cursor: pointer;
      transition: transform .16s ease, background .16s ease, border-color .16s ease, box-shadow .16s ease;
    }
    .key:hover {
      transform: translateY(-2px);
      border-color: rgba(134, 112, 204, .32);
      background-color: rgba(247, 244, 255, .95);
      box-shadow: inset 0 1px rgba(255,255,255,.95), 0 9px 22px rgba(64, 58, 110, .11);
    }
    .key:active { transform: translateY(0) scale(.98); }
    .key.scientific { min-height: 43px; border-radius: 13px; color: #705db7; font-size: 13px; }
    .key.utility { color: #a04c7d; background-color: rgba(245, 220, 237, .68); font-size: 15px; }
    .key.operator { color: #7058c2; background-color: rgba(226, 218, 249, .72); font-size: 22px; }
    .key.equals {
      border-color: transparent;
      color: #fff;
      background: linear-gradient(135deg, #8871df, #57bca1);
      box-shadow: 0 9px 24px rgba(121, 98, 199, .22), inset 0 1px rgba(255,255,255,.38);
      font-size: 22px;
      font-weight: 800;
    }
    .key.equals:hover { border-color: transparent; background: linear-gradient(135deg, #7960d2, #48ad91); }
    .key.zero { grid-column: span 2; }

    .side-panel {
      display: flex;
      flex-direction: column;
      min-height: 100%;
      overflow: hidden;
      border-radius: 28px;
      padding: 22px 19px 17px;
      animation: rise-in .7s .08s cubic-bezier(.2,.8,.2,1) both;
    }
    .history-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 2px 16px; }
    .history-title { margin: 0; font-size: 14px; font-weight: 700; }
    .history-count { margin-right: 5px; color: var(--subtle); font-size: 11px; font-weight: 500; }
    .clear-history {
      border: 0;
      padding: 6px 4px;
      color: #7060ad;
      background: transparent;
      font-size: 11px;
      cursor: pointer;
    }
    .clear-history:hover { color: var(--pink); }
    .history-list { display: grid; align-content: start; gap: 8px; max-height: 360px; overflow: auto; padding: 0 2px 4px; scrollbar-color: rgba(125, 108, 188, .3) transparent; scrollbar-width: thin; }
    .history-item {
      display: block;
      width: 100%;
      min-height: 68px;
      border: 1px solid rgba(120, 115, 154, .1);
      border-radius: 14px;
      padding: 11px 12px;
      color: var(--text);
      background: rgba(255, 255, 255, .55);
      text-align: left;
      cursor: pointer;
      transition: border-color .16s ease, background .16s ease, transform .16s ease;
    }
    .history-item:hover { transform: translateY(-1px); border-color: rgba(130, 108, 205, .28); background: rgba(255,255,255,.88); }
    .history-expression { overflow: hidden; color: #85849c; direction: ltr; font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
    .history-result { margin-top: 5px; color: #39334f; direction: ltr; font-size: 16px; font-variant-numeric: tabular-nums; font-weight: 650; }
    .empty-history { display: grid; min-height: 190px; place-content: center; justify-items: center; gap: 9px; color: var(--subtle); text-align: center; }
    .empty-icon { display: grid; width: 42px; height: 42px; place-items: center; border: 1px solid var(--stroke); border-radius: 14px; color: #7864bf; background: rgba(164, 135, 255, .1); font-size: 19px; }
    .empty-history p { max-width: 180px; margin: 0; font-size: 11px; line-height: 1.8; }
    .side-bottom { margin-top: auto; padding-top: 16px; }
    .copy-button {
      width: 100%;
      min-height: 42px;
      border: 1px solid rgba(132, 108, 200, .2);
      border-radius: 13px;
      color: #6758a4;
      background: rgba(151, 123, 236, .08);
      font-size: 12px;
      font-weight: 650;
      cursor: pointer;
      transition: background .16s ease, border-color .16s ease;
    }
    .copy-button:hover { border-color: rgba(132, 108, 200, .4); background: rgba(151, 123, 236, .15); }
    .keyboard-note { margin: 12px 0 0; color: var(--subtle); font-size: 10px; line-height: 1.8; text-align: center; }
    .keyboard-note kbd { border: 1px solid rgba(120, 115, 154, .2); border-radius: 5px; padding: 1px 5px; color: #64627a; font: inherit; }
    .toast {
      position: fixed;
      z-index: 3;
      right: 50%;
      bottom: 24px;
      max-width: calc(100vw - 32px);
      transform: translate(50%, 16px);
      border: 1px solid var(--stroke-bright);
      border-radius: 12px;
      padding: 10px 16px;
      color: var(--text);
      background: rgba(255, 255, 255, .96);
      box-shadow: 0 12px 35px rgba(47, 42, 84, .16);
      font-size: 12px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s ease, transform .2s ease;
    }
    .toast.visible { transform: translate(50%, 0); opacity: 1; }

    @keyframes rise-in { from { transform: translateY(14px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @media (max-width: 760px) {
      body { padding: 25px 15px; }
      .workspace { grid-template-columns: minmax(0, 1fr); gap: 14px; }
      .calculator { padding: 20px; }
      .side-panel { min-height: 0; padding: 18px; }
      .history-list { max-height: 230px; }
      .empty-history { min-height: 112px; }
      .side-bottom { padding-top: 12px; }
      .keyboard-note { margin-top: 8px; }
    }
    @media (max-width: 420px) {
      body { padding: 17px 11px; }
      .masthead { margin: 0 2px 16px; }
      .masthead-note { font-size: 10px; }
      .brand-mark { width: 41px; height: 41px; border-radius: 14px; }
      .calculator { border-radius: 23px; padding: 15px; }
      .display { min-height: 128px; border-radius: 17px; padding: 14px; }
      .scientific-grid, .keypad-grid { gap: 7px; }
      .key { min-height: 52px; border-radius: 14px; }
      .key.scientific { min-height: 40px; }
      .side-panel { border-radius: 23px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="masthead">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">✳</div>
        <div>
          <p class="brand-name">Luna</p>
          <p class="brand-caption">Scientific calculator</p>
        </div>
      </div>
      <div class="masthead-note"><span class="live-dot" aria-hidden="true"></span> Ready when you are</div>
    </header>

    <div class="workspace">
      <section class="calculator glass" aria-label="Scientific calculator">
        <div class="calculator-head">
          <p class="section-label">A little brilliance, built in</p>
          <button class="mode-toggle" id="angle-mode" type="button" aria-label="Angle mode: DEG. Click to switch.">DEG</button>
        </div>

        <div class="display" role="group" aria-label="Calculation display">
          <div class="expression" id="expression" aria-label="Expression">0</div>
          <output class="result-line" id="result" aria-live="polite" aria-label="Result">0</output>
          <div class="display-hint" id="display-hint">Enter a number to get started</div>
        </div>

        <div class="key-groups">
          <div class="scientific-grid" aria-label="Scientific functions">
            <button class="key scientific" type="button" data-function="sin" aria-label="Sine">sin</button>
            <button class="key scientific" type="button" data-function="cos" aria-label="Cosine">cos</button>
            <button class="key scientific" type="button" data-function="tan" aria-label="Tangent">tan</button>
            <button class="key scientific" type="button" data-function="sqrt" aria-label="Square root">√</button>
            <button class="key scientific" type="button" data-function="ln" aria-label="Natural logarithm">ln</button>
            <button class="key scientific" type="button" data-function="log" aria-label="Base-10 logarithm">log</button>
            <button class="key scientific" type="button" data-value="^2" aria-label="Square">x²</button>
            <button class="key scientific" type="button" data-value="π" aria-label="Pi">π</button>
            <button class="key scientific" type="button" data-value="(" aria-label="Open parenthesis">(</button>
            <button class="key scientific" type="button" data-value=")" aria-label="Close parenthesis">)</button>
            <button class="key scientific" type="button" data-value="e" aria-label="Euler's number">e</button>
            <button class="key scientific" type="button" data-value="!" aria-label="Factorial">n!</button>
          </div>

          <div class="keypad-grid" aria-label="Calculator keypad">
            <button class="key utility" type="button" data-action="clear" aria-label="Clear all">AC</button>
            <button class="key utility" type="button" data-action="sign" aria-label="Change sign">+/−</button>
            <button class="key utility" type="button" data-value="%" aria-label="Percent">%</button>
            <button class="key operator" type="button" data-value="/" aria-label="Divide">÷</button>
            <button class="key" type="button" data-value="7">7</button>
            <button class="key" type="button" data-value="8">8</button>
            <button class="key" type="button" data-value="9">9</button>
            <button class="key operator" type="button" data-value="*" aria-label="Multiply">×</button>
            <button class="key" type="button" data-value="4">4</button>
            <button class="key" type="button" data-value="5">5</button>
            <button class="key" type="button" data-value="6">6</button>
            <button class="key operator" type="button" data-value="-" aria-label="Subtract">−</button>
            <button class="key" type="button" data-value="1">1</button>
            <button class="key" type="button" data-value="2">2</button>
            <button class="key" type="button" data-value="3">3</button>
            <button class="key operator" type="button" data-value="+" aria-label="Add">+</button>
            <button class="key zero" type="button" data-value="0">0</button>
            <button class="key" type="button" data-value=".">.</button>
            <button class="key equals" type="button" data-action="equals" aria-label="Calculate">=</button>
          </div>
        </div>
      </section>

      <aside class="side-panel glass" aria-label="Calculation history">
        <div class="history-head">
          <h2 class="history-title">Recent calculations <span class="history-count" id="history-count">0</span></h2>
          <button class="clear-history" id="clear-history" type="button">Clear</button>
        </div>
        <div class="history-list" id="history-list" aria-live="polite"></div>
        <div class="side-bottom">
          <button class="copy-button" id="copy-result" type="button">Copy result</button>
          <p class="keyboard-note"><kbd>Enter</kbd> calculate <span aria-hidden="true">·</span> <kbd>Esc</kbd> clear <span aria-hidden="true">·</span> <kbd>⌫</kbd> delete</p>
        </div>
      </aside>
    </div>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    (() => {
      const expressionEl = document.getElementById("expression");
      const resultEl = document.getElementById("result");
      const hintEl = document.getElementById("display-hint");
      const angleButton = document.getElementById("angle-mode");
      const historyList = document.getElementById("history-list");
      const historyCount = document.getElementById("history-count");
      const toast = document.getElementById("toast");
      const historyKey = "luna-calculator-history";
      const formatter = new Intl.NumberFormat("en-US", { maximumFractionDigits: 10, useGrouping: true });
      let expression = "";
      let currentResult = null;
      let history = [];
      let angleMode = "DEG";
      let justEvaluated = false;
      let toastTimer;

      try {
        const saved = JSON.parse(localStorage.getItem(historyKey) || "[]");
        if (Array.isArray(saved)) history = saved.filter(item =>
          item && typeof item.expression === "string" && Number.isFinite(item.result)
        ).slice(0, 8);
      } catch {
        showToast("Saved history could not be loaded.");
      }

      function formatExpression(value) {
        return String(value)
          .replace(/\*/g, "×")
          .replace(/\//g, "÷")
          .replace(/-/g, "−")
          .replace(/\./g, ".");
      }

      function formatNumber(value) {
        if (!Number.isFinite(value)) return "—";
        const clean = Math.abs(value) < 1e15 && value !== 0 ? Number(value.toPrecision(12)) : value;
        return formatter.format(clean);
      }

      function render() {
        expressionEl.textContent = expression ? formatExpression(expression) : "0";
        resultEl.classList.remove("error");
        if (!expression) {
          resultEl.textContent = "0";
          hintEl.textContent = "Enter a number to get started";
          currentResult = 0;
          return;
        }

        try {
          const value = evaluate(expression);
          currentResult = Number.isFinite(value) ? value : null;
          resultEl.textContent = currentResult === null ? "—" : formatNumber(currentResult);
          hintEl.textContent = currentResult === null ? "Result is outside the display range" : "Live result preview";
        } catch {
          currentResult = null;
          resultEl.textContent = "…";
          hintEl.textContent = "Keep going to complete the expression";
        }
      }

      function showError(message) {
        resultEl.textContent = message;
        resultEl.classList.add("error");
        hintEl.textContent = "Check your expression";
      }

      function tokenize(source) {
        const tokens = [];
        const pattern = /\s*(?:(\d+(?:\.\d*)?|\.\d+)|([a-zA-Z]+)|([()+\-*/^!%])|(π))/gy;
        let position = 0;
        while (position < source.length) {
          pattern.lastIndex = position;
          const match = pattern.exec(source);
          if (!match) throw new Error("Invalid character");
          tokens.push(match[1] || match[2] || match[3] || match[4]);
          position = pattern.lastIndex;
        }
        return tokens;
      }

      function evaluate(source) {
        const tokens = tokenize(source);
        let cursor = 0;
        const peek = () => tokens[cursor];
        const take = () => tokens[cursor++];

        function parseExpression() {
          let value = parseTerm();
          while (peek() === "+" || peek() === "-") {
            const operator = take();
            const right = parseTerm();
            value = operator === "+" ? value + right : value - right;
          }
          return value;
        }

        function parseTerm() {
          let value = parseUnary();
          while (peek() === "*" || peek() === "/") {
            const operator = take();
            const right = parseUnary();
            if (operator === "/" && right === 0) throw new Error("Division by zero");
            value = operator === "*" ? value * right : value / right;
          }
          return value;
        }

        function parseUnary() {
          if (peek() === "+") { take(); return parseUnary(); }
          if (peek() === "-") { take(); return -parseUnary(); }
          return parsePower();
        }

        function parsePower() {
          const base = parsePostfix();
          if (peek() === "^") {
            take();
            return base ** parseUnary();
          }
          return base;
        }

        function parsePostfix() {
          let value = parsePrimary();
          while (peek() === "!" || peek() === "%") {
            const operator = take();
            if (operator === "%") {
              value /= 100;
            } else {
              if (!Number.isInteger(value) || value < 0 || value > 170) throw new Error("Factorial is defined for integers from 0 to 170.");
              let product = 1;
              for (let factor = 2; factor <= value; factor++) product *= factor;
              value = product;
            }
          }
          return value;
        }

        function parsePrimary() {
          const token = take();
          if (token === undefined) throw new Error("Incomplete expression");
          if (token === "(") {
            const value = parseExpression();
            if (take() !== ")") throw new Error("Missing closing parenthesis");
            return value;
          }
          if (/^(?:\d+(?:\.\d*)?|\.\d+)$/.test(token)) return Number(token);
          if (token === "π") return Math.PI;
          if (token === "e") return Math.E;
          if (/^[a-zA-Z]+$/.test(token)) {
            const functions = {
              sin: value => Math.sin(toRadians(value)),
              cos: value => Math.cos(toRadians(value)),
              tan: value => {
                if (Math.abs(Math.cos(toRadians(value))) < 1e-14) throw new Error("Tangent is undefined for this angle.");
                return Math.tan(toRadians(value));
              },
              asin: value => fromRadians(Math.asin(value)),
              acos: value => fromRadians(Math.acos(value)),
              atan: value => fromRadians(Math.atan(value)),
              sqrt: value => Math.sqrt(value),
              cbrt: value => Math.cbrt(value),
              ln: value => Math.log(value),
              log: value => Math.log10(value),
              abs: value => Math.abs(value),
              exp: value => Math.exp(value)
            };
            const operation = functions[token];
            if (!operation || take() !== "(") throw new Error("Unknown function or missing parenthesis");
            const argument = parseExpression();
            if (take() !== ")") throw new Error("Missing closing parenthesis after function");
            return operation(argument);
          }
          throw new Error("Invalid expression");
        }

        function toRadians(value) { return angleMode === "DEG" ? value * Math.PI / 180 : value; }
        function fromRadians(value) { return angleMode === "DEG" ? value * 180 / Math.PI : value; }

        const result = parseExpression();
        if (cursor !== tokens.length) throw new Error("Unexpected input after expression");
        if (!Number.isFinite(result)) throw new Error("No finite result");
        return result;
      }

      function renderHistory() {
        historyList.replaceChildren();
        historyCount.textContent = String(history.length);
        if (!history.length) {
          const empty = document.createElement("div");
          empty.className = "empty-history";
          const icon = document.createElement("span");
          icon.className = "empty-icon";
          icon.setAttribute("aria-hidden", "true");
          icon.textContent = "↺";
          const copy = document.createElement("p");
          copy.textContent = "Your recent calculations will appear here for easy access.";
          empty.append(icon, copy);
          historyList.append(empty);
          return;
        }

        history.forEach((item, index) => {
          const button = document.createElement("button");
          button.className = "history-item";
          button.type = "button";
          button.dataset.historyIndex = String(index);
          const source = document.createElement("div");
          source.className = "history-expression";
          source.textContent = formatExpression(item.expression);
          const answer = document.createElement("div");
          answer.className = "history-result";
          answer.textContent = formatNumber(item.result);
          button.append(source, answer);
          historyList.append(button);
        });
      }

      function persistHistory() {
        try {
          localStorage.setItem(historyKey, JSON.stringify(history));
          return true;
        } catch {
          showToast("History could not be saved in this browser.");
          return false;
        }
      }

      function showToast(message) {
        toast.textContent = message;
        toast.classList.add("visible");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove("visible"), 2300);
      }

      function endsWithValue(value) { return /(?:\d|π|e|\)|!|%)$/.test(value); }

      function appendValue(value) {
        if (justEvaluated) {
          if (/^[\d.]$/.test(value) || value === "π" || value === "e" || value.endsWith("(")) expression = "";
          justEvaluated = false;
        }
        if (value === "(" && endsWithValue(expression)) expression += "*";
        if ((value === "π" || value === "e" || value.endsWith("(")) && endsWithValue(expression)) expression += "*";
        if (/^\d$/.test(value) && /[πe)]$/.test(expression)) expression += "*";
        if (value === "." && /[πe)]$/.test(expression)) expression += "*0";
        expression += value;
        render();
      }

      function addFunction(name) {
        if (justEvaluated) {
          expression = "";
          justEvaluated = false;
        }
        if (endsWithValue(expression)) expression += "*";
        expression += `${name}(`;
        render();
      }

      function clearAll() {
        expression = "";
        justEvaluated = false;
        render();
      }

      function toggleSign() {
        if (!expression) {
          expression = "-";
        } else if (expression.startsWith("-(") && expression.endsWith(")")) {
          expression = expression.slice(2, -1);
        } else {
          expression = `-(${expression})`;
        }
        justEvaluated = false;
        render();
      }

      function calculate() {
        if (!expression) return;
        try {
          const value = evaluate(expression);
          const entry = { expression, result: value, createdAt: Date.now() };
          history = [entry, ...history.filter(item => item.expression !== entry.expression || item.result !== entry.result)].slice(0, 8);
          persistHistory();
          renderHistory();
          expression = String(Number(value.toPrecision(12)));
          justEvaluated = true;
          render();
          hintEl.textContent = "Calculation complete";
        } catch (error) {
          showError(error.message === "Division by zero" ? "Cannot divide by zero" : "Unable to calculate this expression");
        }
      }

      document.querySelectorAll("[data-value], [data-function], [data-action]").forEach(button => {
        button.addEventListener("click", () => {
          if (button.dataset.action === "clear") clearAll();
          else if (button.dataset.action === "equals") calculate();
          else if (button.dataset.action === "sign") toggleSign();
          else if (button.dataset.function) addFunction(button.dataset.function);
          else appendValue(button.dataset.value);
        });
      });

      angleButton.addEventListener("click", () => {
        angleMode = angleMode === "DEG" ? "RAD" : "DEG";
        angleButton.textContent = angleMode;
        angleButton.setAttribute("aria-label", `Angle mode: ${angleMode}. Click to switch.`);
        render();
      });

      document.getElementById("clear-history").addEventListener("click", () => {
        if (!history.length) return;
        history = [];
        persistHistory();
        renderHistory();
        showToast("History cleared.");
      });

      historyList.addEventListener("click", event => {
        const button = event.target.closest("[data-history-index]");
        if (!button) return;
        const item = history[Number(button.dataset.historyIndex)];
        if (!item) return;
        expression = String(Number(item.result.toPrecision(12)));
        justEvaluated = true;
        render();
        hintEl.textContent = "Result restored from history";
      });

      document.getElementById("copy-result").addEventListener("click", async () => {
        if (currentResult === null) {
          showToast("There is no result to copy.");
          return;
        }
        if (!navigator.clipboard || !navigator.clipboard.writeText) {
          showToast("Clipboard access is unavailable on this page.");
          return;
        }
        try {
          await navigator.clipboard.writeText(String(currentResult));
          showToast("Result copied.");
        } catch {
          showToast("Could not copy the result.");
        }
      });

      document.addEventListener("keydown", event => {
        if (event.ctrlKey || event.metaKey || event.altKey) return;
        if (/^\d$/.test(event.key)) {
          event.preventDefault();
          appendValue(event.key);
        } else if (["+", "-", "*", "/", "^", "(", ")", ".", "%", "!"].includes(event.key)) {
          event.preventDefault();
          appendValue(event.key);
        } else if (event.key === "Enter" || event.key === "=") {
          event.preventDefault();
          calculate();
        } else if (event.key === "Backspace") {
          event.preventDefault();
          expression = expression.slice(0, -1);
          justEvaluated = false;
          render();
        } else if (event.key === "Escape") {
          event.preventDefault();
          clearAll();
        }
      });

      renderHistory();
      render();
    })();
  </script>
</body>
</html>
